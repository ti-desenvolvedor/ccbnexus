name: Testes

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite, sqlite, xml, zip
          coverage: none

      - name: Dependências PHP
        uses: ramsey/composer-install@v3

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependências e CSS
        run: npm ci && npm run build

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: php artisan test
